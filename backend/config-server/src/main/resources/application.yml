spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/AshutoshKumarJha2/ES_microservice
          skip-ssl-validation: true
          clone-on-start: true
          default-label: config

server:
  port: 6971

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6969/eureka