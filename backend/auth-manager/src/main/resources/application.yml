spring:
  application:
    name: auth-manager
  config:
    import: configserver:http://localhost:6971
  profiles:
    active: local
  cloud:
    config:
      profile: default

server:
  port: 7070

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6969/eureka

service-token:
  expiration-in-m: 1

# BCrypt hashes of each service's pre-shared secret.
# Generate: BCryptPasswordEncoder.encode("your-secret-here")
# Store plaintext secrets in each service's config (never committed to git).
